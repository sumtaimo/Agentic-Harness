name: test

# Runs the harness's own test suite (zero dependencies, Node.js standard library only).
on:
  pull_request:
  push:
    branches: [lab, release]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-test:
    # Linux, macOS and Windows: the harness must work for every user, not only on the lab machine.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No "npm install": the project has no dependencies.
      # Each failing test is also raised as an annotation, so it is visible on the run page (and the public API)
      # without opening the full log.
      - run: git config --global user.name ci && git config --global user.email ci@ci.local
      - name: npm test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt || {
            grep -E '^\s*✖|^not ok|Error' test-output.txt | head -40 | sed 's/^\s*/::error title=npm test::/'
            exit 1
          }
      - name: npm run audit
        run: npm run audit
