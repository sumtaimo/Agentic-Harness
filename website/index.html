<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Agentic-Harness: deterministic multi-agent orchestration on the AI CLIs you already use (claude, agy, codex, gemini)." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap"
    />
    <title>Agentic-Harness</title>
    <script>
      // Apply the saved theme and language before first paint (no flash).
      try {
        if (localStorage.getItem('ah-theme') === 'light') document.documentElement.classList.remove('dark');
        if (localStorage.getItem('ah-lang') === 'kh') document.documentElement.lang = 'km';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
