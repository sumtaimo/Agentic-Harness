<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Agentic Harness: give a goal in one line, and a team of AI agents does it, checked by rules, on the AI CLIs you already use." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,400&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Khmer:wght@400;500;600&display=swap"
    />
    <title>Agentic Harness</title>
    <script>
      // Light is the default. Apply a saved choice before first paint (no flash).
      try {
        if (localStorage.getItem('ah-theme') === 'dark') document.documentElement.classList.add('dark');
        if (localStorage.getItem('ah-lang') === 'kh') document.documentElement.lang = 'km';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
